# Box B drop-in for redoubt-ci-vm.service (installed by install-boxb.sh as
# ~/.config/systemd/user/redoubt-ci-vm.service.d/10-boxb.conf). The VM is a guest on a host
# whose owner runs llama-server and another project's runner VMs; Redoubt yields to both.
[Unit]
Description=Redoubt CI in an isolated QEMU/KVM virtual machine (box B, on demand)

[Service]
# Global OOM order: the Redoubt QEMU (24 GiB, ~390 by RSS share) goes before the other project's
# QEMUs (~130 + 500) and llama-server (~0). A killed build fails; the others keep running.
OOMScoreAdjust=700
# Guest RAM 24 GiB plus QEMU overhead; a runaway QEMU is killed inside its own cgroup first.
MemoryMax=26G
# Under CPU or I/O contention, everything else on box B gets twice Redoubt's share.
CPUWeight=50
IOWeight=50
# No automatic restart. The base unit's Restart=on-failure would bring the VM back 10 s after an
# OOM kill (OOMScoreAdjust above makes it the first victim) without asking boxb-ctl.sh's memory
# gate, and under sustained pressure that loops. Every start must go through the gate.
Restart=no
# Autostart stays off: boxb-ctl.sh starts the unit when box A's poller sees a queued job.
