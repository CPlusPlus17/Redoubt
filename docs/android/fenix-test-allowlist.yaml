# Expected-failure allowlist for `./mach gradle fenix:testDebugUnitTest`.
#
# Owned by LW-M2-09. Consumed by:
#     python3 docs/android/board.py --check-fenix-tests
#
# WHY THIS FILE EXISTS
# --------------------
# The Definition of done in AGENTS.md requires the Fenix unit suite to pass for
# any Kotlin-layer change, and it cannot pass outright: libmegazord.so is an
# Android ELF and the suite runs on the host JVM, so every test that reaches
# appservices through UniFFI dies on load. Before this file, each task had to
# re-derive that residue by hand and difference it against a baseline it ran
# itself — expensive, and it trains people to wave failures through.
#
# KEYED ON CLASS NAME, NOT ERROR TYPE — deliberately.
# mobile/android/fenix/app/build.gradle sets `forkEvery = 80`, so the JVM is
# recycled every 80 tests. Whether a megazord-backed test reports
# UnsatisfiedLinkError (first touch in a fresh JVM) or NoClassDefFoundError
# ("Could not initialize class ...UniffiLib" — a later touch in a JVM where the
# static initializer already failed) depends on where the fork boundary falls,
# and that moves whenever the patch set changes the test count. It has already
# moved once: the LW-M4-14 baseline recorded NoClassDefFoundError for
# ReviewPromptMiddlewareTriggerCriteriaTest; the 2026-08-25 run records
# UnsatisfiedLinkError for all 16. The error type is not a stable key.
#
# `tests:` is a CEILING, not an assertion of equality. More failures in an
# allowlisted class than declared here is a hard error (a real regression
# hiding behind an environmental name). Fewer is a warning: the entry is going
# stale and should be trimmed — that is how AutofillSettingsMiddlewareTest left
# this list.
#
# SearchSuggestionsProvidersBuilderTest (70, megazord) left the list the same
# way on 2026-10-02: the full 153.4.0esr suite ran all 70 and passed them.
#
# The first full suite on Firefox 157.0 (2026-10-02, 649 classes / 6,066 tests,
# 13 failing = 11 environmental + 2 known-real + 0 unexpected) trimmed three
# entries as the gate's warnings asked; each reason below says which.

# Failures caused by the build/test environment, not by code under test.
allowlist:
  - class: org.mozilla.fenix.reviewprompt.ReviewPromptMiddlewareTriggerCriteriaTest
    tests: 9
    reason: >
      Every test calls NimbusApi methods routed through
      org.mozilla.experiments.nimbus.internal.UniffiLib, whose static
      initializer loads libmegazord.so.
      Lowered 16 -> 9 on 2026-10-02: upstream 157.0 ships 9 tests in this
      class (16 in 153), and the 157 suite fails all 9 with
      "UnsatisfiedLinkError: Unable to load library 'megazord'".
  - class: org.mozilla.fenix.experiments.RecordedNimbusContextTest
    tests: 1
    reason: >
      Directly invokes a recorded NimbusApi event query, hitting the same
      missing native library.
  - class: org.mozilla.fenix.settings.autofill.ui.AutofillSettingsMiddlewareTest
    tests: 1
    reason: >
      Back on this list, which the note above predicted: it left when the
      2026-08-25 run showed it passing, and the 2026-09-06 run -- the first full
      suite this project has actually executed -- has it failing again with
      "Could not initialize class mozilla.appservices.autofill.UniffiLib" on all
      three. Same cause as the entries above, a different appservices component:
      the autofill UniFFI binding loads libmegazord.so, which is an Android ELF
      the host JVM cannot open. Note the class moved into the .ui package and the
      count dropped from the 5 recorded in the LW-M4-14 baseline to 3, so this is
      not a straight restore of the old entry.
      Lowered 3 -> 2 on 2026-10-02: the full 153.4.0esr suite (615 classes /
      5,562 tests) fails 2 of its 7 tests, with the same UniffiLib error.
      Lowered 2 -> 1 the same day: the 157.0 suite fails 1 of its 7, with
      "Could not initialize class mozilla.appservices.autofill.UniffiLib".

# Real failures that predate the change under test. NOT environmental: these are
# tolerated only so a task can tell "already broken" from "I broke it". Every
# entry here is a bug someone still owes an investigation.
# HomeSettingsFragmentTest (1, bare AssertionError, LW-M4-14 baseline) left on
# 2026-10-02: the 157.0 suite ran its 8 tests and passed them.
known_real:
  - class: org.mozilla.fenix.components.lens.LensCameraFragmentTest
    tests: 1
    reason: >
      MockK stubbing gap — "no answer found for Context.getPackageManager()".
      Unrelated to megazord. Present in the LW-M4-14 baseline.
  - class: org.mozilla.fenix.distributions.DefaultDistributionProviderCheckerTest
    tests: 1
    reason: >
      "expected:<myProvider> but was:<null>". NEW since the LW-M4-14 baseline
      (2026-08-22) — appeared by the 2026-08-25 run. Nobody has bisected which
      patch caused it; it is listed so the gate is usable, not because it is
      understood.
