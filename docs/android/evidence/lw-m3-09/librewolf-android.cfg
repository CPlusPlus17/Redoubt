defaultPref("privacy.globalprivacycontrol.pbmode.enabled", true); // [ANDROID: LOCK] GeckoRuntimeSettings.java
defaultPref("privacy.globalprivacycontrol.functionality.enabled", true); // [ANDROID: LOCK] GeckoRuntimeSettings.java

