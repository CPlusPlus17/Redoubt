  # ---------------------------------------------------------------- M5
  # Security parity. The point of the whole project.

  - id: LW-M5-01
    title: Lock fission.webContentIsolationStrategy to isolate-high-value
    milestone: M5
    depends_on: [LW-M3-04, LW-M4-03]
    owns: [patches/android/fission-isolation.patch, settings/android.cfg]
    submodule: settings
    tree_paths:
      - mobile/android/fenix/app/nimbus.fml.yaml
      - mobile/android/fenix/app/src/main/java/org/mozilla/fenix/components/Core.kt
    what: |
      VERIFIED AGAINST THE 153.0.4 TREE. Gecko's own default is
      fission.webContentIsolationStrategy = 1 (StaticPrefList.yaml:6660-6662).
      Fenix overwrites it with 0 (ISOLATE_NOTHING) on release: the FML default at
      nimbus.fml.yaml:521-529 is 0, raised to 2 only for the nightly and developer
      channels (:530-535), and Core.kt:207-208 applies the FML value
      UNCONDITIONALLY. The `shouldUseNimbus` flag (default false), whose
      description promises that StaticPrefList applies when it is off, is only
      honoured at GeckoProvider.kt:137 and only gates `.fissionEnabled()` — never
      the isolation strategy. Fix both call sites, not just the pref: a locked
      pref that Core.kt overwrites at runtime is landmine L2 all over again.
      Measure RAM and startup on a low-end device before choosing 1 over 2.

      STATUS 2026-08-22 (patch + decision + upstream report done; runtime
      verification parked under rule G):
      DECISION - locked to 2 (ISOLATE_HIGH_VALUE), not 1. Rationale: 1
      (ISOLATE_EVERYTHING) puts every site-origin in its own content process and
      costs more RAM and startup; on a 3-4 GB device 2 is the Android-tuned floor.
      2 also matches the no-nimbus FML default and the value android-components
      hardcodes for non-Fenix consumers (StaticPrefList.yaml:6658 comment). Gecko's
      own default is 1, but that is the desktop/stronger posture, not what a
      memory-constrained phone should ship by default.
      MECHANISM - patches/android/fission-isolation.patch hard-codes
      WebContentIsolationStrategy.ISOLATE_HIGH_VALUE at Core.kt:207-208, replacing
      the FxNimbus FML read. A constant cannot be lowered by a Nimbus experiment, a
      Fenix settings write, or an upstream default flip (same rationale as
      isolated-process.patch, LW-M5-02). This is the code-level guarantee for
      acceptance #2: Core.kt:207-208 has no remaining path that reads a lower
      value. Listed in assets/patches/android.txt after no-nimbus.patch. Divergence
      from no-nimbus.patch line 316 (which expected this patch to "share
      nimbus.fml.yaml"): it instead hard-codes in Core.kt - the only file it
      touches - so it is order-free with the rest of the set (measured:
      no-nimbus <-> fission-isolation both orders, 0 rejects; fuzz 0).
      UPSTREAM - the shouldUseNimbus/isolationStrategy inconsistency is drafted as
      a reproduction in docs/android/UPSTREAM-FIREFOX.md. PENDING owner sign-off and
      filing (per the M5 ground rules, public wording is not filed or published
      without sign-off); NO bug link recorded yet.
      PARKED (rule G - environment, not logic): acceptance #1 (value in
      about:config after settings), the runtime half of #2 (set the FML value to 0
      and show Core.kt still applies 2), and #3 (RAM/startup) all require a rebuild
      (multi-hour container build: android-fat-aar.sh pass 1 + android-apk.sh pass 2)
      plus a stable device. The only device here is a 3072 MB API-30 AVD (lw30),
      NOT a 4 GB device - say so and record what is measured, per the goal. Next
      steps: (a) rebuild with the 43-patch list and re-prove the artefact (patch
      list, fresh libxul, cfg canary); (b) on the AVD, drive about:config and read
      fission.webContentIsolationStrategy after opening settings; (c) attempt to
      lower it via a Nimbus/pref path and show it stays 2; (d) record
      cold-start ms + per-process RSS on the 3072 MB AVD, flagged as not the 4 GB
      target.
    acceptance:
      - "the effective value is 1 or 2 at runtime (justify which), verified in about:config after settings has been opened"
      - "Core.kt:207-208 can no longer lower it — verified by exercising the path, not by reading it"
      - "RAM and startup cost measured on a 4GB device and recorded"
      - "the shouldUseNimbus/isolationStrategy inconsistency is reported upstream as a bug, with the bug link recorded here"
    verify: "./scripts/android-smoke.sh --pref-dump | grep 'fission.webContentIsolationStrategy'"
    effort_h: "4-8"
    skills: [kotlin, android]
    agent_safe: yes
    isolation: worktree
    risk: Process-per-site on a memory-constrained device can OOM-kill tabs; measure before shipping.

  - id: LW-M5-02
    title: Enable isolatedProcess and the app zygote
    milestone: M5
    depends_on: [LW-M2-04]
    owns: [patches/android/isolated-process.patch]
    tree_paths:
      - mobile/android/fenix/app/src/main/java/org/mozilla/fenix/gecko/GeckoProvider.kt
    what: |
      VERIFIED AGAINST THE 153.0.4 TREE — and it is easier than the plan first
      assumed. GeckoProvider.kt:134-135 ALREADY calls .isolatedProcessEnabled()
      and .appZygoteProcessEnabled(); no new call sites are needed. They read
      Settings.isIsolatedProcessEnabled / isAppZygoteEnabled
      (Settings.kt:980-992), which default to the FML feature
      `isolated-content-processes` — and both of its variables default to FALSE
      (nimbus.fml.yaml:1040-1052). The only UI exposing them is
      SecretSettingsFragment.kt:410,416, the hidden debug menu. So this task is
      flipping two defaults and making them stick, not adding plumbing. Check
      whether the app zygote has a minimum API level before defaulting it on.

      VERIFIED 2026-08-22 on the fresh release build (org.mozilla.firefox, HEAD
      5d8af8f, x86_64, API 30) — closing the patch's "NOT VERIFIED: RELEASE
      variant" gap:
      (1) `adb shell ps -A -Z` on a stock install shows the content processes
          under isolated uids u0_i0..u0_i2 in the isolated_app SELinux domain,
          each forked from the app zygote (org.mozilla.firefox_zygote,
          app_zygote domain, uid u0_a142); the main process stays untrusted_app.
          Both isolatedProcess and the app zygote are live on the release build.
      (2) The values survive a Nimbus/prefs fetch: the profile already carries
          pref_key_nimbus_experiments_fetched=true and isolation holds; and
          injecting pref_key_enable_isolated_process=false and
          pref_key_enable_app_zygote_process=false (which the app reads into its
          prefs), then cold-launching, left isolation intact. That is because the
          patch sets the GeckoRuntimeSettings.Builder args to literal true at the
          call site, not from FML/prefs — so Nimbus cannot lower them. Confirmed
          on a COLD start, not a stale first-run state.
      (3) Startup cost: cold start TotalTime 333ms / 238ms (am start -W).
      (4) Functional regression, WITH isolation active: page-load-http and
          page-load-https PASS (https is a validated secure context), video
          decodes; librewolf.webgl.prompt=False so L1 is not the cause of the
          one webgl pixel mismatch (a documented SwiftShader/emulator GL limit).
          The getusermedia and extension smoke checks did not complete: the host
          emulator crashes on the camera/GL path (s_glUnmapBufferAEMU: could not
          get host gpu pointer!) in both -gpu host and -gpu swiftshader_indirect
          modes, with no app FATAL/ANR/kill in logcat. Recorded as
          environment-blocked; re-run those two checks on a stable GPU host.
    acceptance:
      - "content processes run under isolated uids on a stock install, verified with `adb shell ps -A -Z`"
      - "the app zygote process is present, or its absence is explained by an API-level floor"
      - "the values survive a Nimbus fetch — they are not merely set once at first run"
      - "no functional regression in the smoke test, and startup cost measured"
    verify: "adb shell ps -A -Z | grep -c isolated"
    effort_h: "4-8"
    skills: [kotlin, android]
    agent_safe: yes
    isolation: worktree
    risk: isolatedProcess restricts what content processes may do; some GeckoView features break subtly under it.

