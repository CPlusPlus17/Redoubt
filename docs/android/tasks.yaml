    acceptance:
      - "`make docker-build-image CONTAINER_ENGINE=podman` works"
      - "the default with no CONTAINER_ENGINE set is unchanged for existing docker users"
      - "the android image targets build assets/Dockerfile.android"
    verify: "make -n android-build-image CONTAINER_ENGINE=podman"
    effort_h: "1-2"
    skills: [make, ops]
    agent_safe: yes
