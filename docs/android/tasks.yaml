  - id: LW-M1-16
    title: Restore make fixfuzz and stop mutating the user's global git config
    milestone: M1
    depends_on: [LW-M1-11, LW-M1-15]
    owns: [scripts/fuzzfail.sh, scripts/git-patchtree.sh]
    what: |
      TWO THINGS, and the first is a REGRESSION we caused.

      (1) `make fixfuzz` now regenerates NOTHING. LW-M1-15 made git-patchtree.sh
      refuse a bare invocation (exit 2), and fuzzfail.sh:304-312 calls it inside a
      subshell with `|| exit 1`, so all 23 fuzzy patches come back under "patches
      that need a human, not a fuzz rebuild". Reproduced end to end against a real
      803MB tarball replica: EXIT=1, zero .nofuzz written. The two files are owned
      by different tasks, which is exactly why it slipped — this task owns BOTH so
      it can land as a pair. Teach fuzzfail.sh git-patchtree.sh's new interface.

      Note the board's own verify for LW-M1-15 (`make -n fixfuzz`) CANNOT see this,
      because -n does not execute. Any verify you write here must actually run the
      regeneration against at least one genuinely fuzzy patch and confirm a
      .nofuzz appears.

      (2) PRE-EXISTING, and it damages the user's environment outside the repo:
      fuzzfail.sh runs `git config --global commit.gpgsign false` before the
      regeneration and `git config --global commit.gpgsign true` after
      (HEAD:scripts/fuzzfail.sh:32,34 — this predates all Android work). Three
      faults: a repo script must never write the user's GLOBAL config; it restores
      a HARDCODED `true` rather than the user's prior value, so anyone who had it
      unset or false gets commit signing silently switched on for every repo they
      own; and an interrupt between the two leaves signing globally OFF.
      Use `git -c commit.gpgsign=false ...` on the individual commands, or set
      GIT_CONFIG_GLOBAL for the subshell, or a repo-local config. Never a global
      write.

      While here: `make clean` and .gitignore both miss the `tmpdir92.*` prefix
      that LW-M1-11's mktemp scratch dirs use, so an interrupted run leaves
      multi-GB directories that show up as untracked for everyone. One was found
      holding 4.6GB. You do not own the Makefile or .gitignore — report what they
      need.
    acceptance:
      - "`make fixfuzz` regenerates a .nofuzz for at least one genuinely fuzzy patch, proven by running it"
      - "no script writes the user's global git config under any code path, including error paths"
      - "an interrupted run leaves the user's git config exactly as it found it"
      - "./scripts/check-patchfail.sh still exits 0"
    verify: "! grep -rn 'config --global' scripts/ && ./scripts/check-patchfail.sh"
    effort_h: "2-4"
    skills: [shell]
    agent_safe: yes
    isolation: none
    risk: Right now make fixfuzz silently does nothing, and running it can flip a global git setting the user never chose.

