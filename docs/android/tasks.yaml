      desktop code — they are StaticPrefs read in core DOM at
      nsContentUtils.cpp:3036-3047, and one caller of
      CalcRoundedWindowSizeForResistingFingerprinting is shared toolkit
      (nsWindowWatcher.cpp:2446, reachable from window.open() with an explicit
      size). They stay desktop because the cap never binds on a phone and
      LibreWolf's value is LOOSER than Gecko's 1400x900 default, so Android keeps
      the tighter Mozilla cap. Moving them back to common is safe if anyone
      disagrees. Note
      that privacy.resistFingerprinting.letterboxing at :255 ships FALSE on
      desktop, so it is not a parity item; do not list it as one. Every moved pref
      needs a one-line reason.
    acceptance:
      - "common.cfg + desktop.cfg reproduces today's librewolf.cfg semantically (same effective prefs on desktop)"
      - "every pref in desktop.cfg has a stated reason it cannot apply on Android"
      - "counts recorded and matching: 178 defaultPref, 60 lockPref, 12 librewolf.* prefs"
    verify: "python3 docs/android/board.py --check-cfg-split && python3 docs/android/board.py --check"
    effort_h: "8-14"
    skills: [js, python]
    agent_safe: yes
