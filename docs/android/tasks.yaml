    risk: Low, but leaving it undone means every podman-using maintainer edits the Makefile locally and eventually commits it.

  - id: LW-M0-14
    title: Derive ff_source_dir from the tarball, not from the version string
    milestone: M0
    depends_on: [LW-M0-02, LW-M0-07, LW-M0-11, LW-M0-12]
    owns: [Makefile, scripts/check-patchfail.sh]
    what: |
      BLOCKER, found by LW-M0-09 and independently confirmed: `make dir
      TARGETS=android` cannot succeed. The ESR tarball
      firefox-153.0esr.source.tar.xz extracts to `firefox-153.0/`, but the Makefile
      computes `ff_source_dir := firefox-$(version)` = `firefox-153.0esr`, so the
      recipe runs `mv firefox-153.0esr librewolf-153.0esr-1` and fails — AFTER a
      766MB download and a ~10GB extract.

      Derive the extracted directory from the tarball itself rather than assuming
      it matches the version string, or strip the `esr` suffix. Deriving is better:
      it also survives whatever Mozilla does next.

      DO NOT USE `tar tf | head -1`. An earlier version of this task said the
      tarball's first member is `firefox-153.0/CLOBBER`. It is not — the first
      member is `./`, on both the ESR and the release tarball, so
      `tar tf | head -1 | cut -d/ -f1` yields `.` and that value is used as an
      `rm -rf` operand. Strip a leading `./` and explicitly reject "", "." and ".."
      before using the result. Do the derivation in the RECIPE shell, not with
      `$(shell ...)`: a parse-time call runs on every `make help` and `make -n`,
      and on a fresh checkout it runs before the tarball exists and evaluates to
      empty.
      scripts/check-patchfail.sh:50 has the identical assumption
      (`cd firefox-$(cat ../version)`) — fix both, and note LW-M1-11 will also touch
      that file.

      Keep the desktop path byte-identical: for a release tarball the derived name
      already equals firefox-$(version).
    acceptance:
      - "`make dir TARGETS=android` gets past the mv and into the patcher"
      - "`make -n dir` for desktop is unchanged"
      - "check-patchfail works against an esr tarball"
      - "the directory name is derived or normalised, not special-cased for the string 'esr'"
    verify: "make -n dir TARGETS=android"
    effort_h: "2-4"
    skills: [make, shell]
    agent_safe: yes
    isolation: none
    risk: Every Android CI run and every Android build is red until this lands, and the failure costs a 766MB download each time.

  - id: LW-M0-15
    title: Add the four missing host toolchains to the Android image
    milestone: M0
    depends_on: [LW-M0-06, LW-M2-01]
    owns: [assets/Dockerfile.android]
    what: |
      FOUND BY LW-M2-01, which got a green build only by installing these by hand.
      The image has the Android toolchains right but omits four host tools that are
      hard configure stops, so a fresh container cannot build without manual setup.
      All four go in $MOZBUILD_STATE_PATH, where bootstrap_path()
      (bootstrap.configure:301-306) finds them even with --enable-bootstrap at its
      default:
        1. clang — symlink $MOZBUILD_STATE_PATH/clang to the NDK's
           prebuilt/linux-x86_64 (toolchain.configure:760 is
           bootstrap_search_path("clang/bin")). Without it configure picks
           /usr/bin/gcc and dies on a CPU mismatch. NDK clang 21.0.0 then serves
           target, host, assembler and wasm.
        2. Node.js 22.16.0 — required by node.configure. The jammy package is
           12.22.9 and NODE_MIN_VERSION is 12.22.12, so the distro package is
           unusable, not merely old.
        3. cbindgen 0.29.4 — `cargo install --root $MOZBUILD_STATE_PATH/cbindgen`
           plus a symlink so the binary sits at cbindgen/cbindgen.
        4. WASI sysroot + wasm32 compiler-rt — RLBox is on by default for all
           little-endian targets (toolkit/moz.configure:2829-2833), so
           aarch64-android needs it. Fetch Mozilla's own artifacts
           (`mach artifact toolchain --from-build sysroot-wasm32-wasi` and
           `wasm32-wasi-compiler-rt-21`) and copy the builtins into the NDK as
           lib/clang/21/lib/wasm32-unknown-wasi/libclang_rt.builtins.a — note the
           rename from the artifact's flat libclang_rt.builtins-wasm32.a.

      DO NOT take configure's suggestion of --without-wasm-sandboxed-libraries.
      LW-M2-01 explicitly refused it: turning off RLBox to make configure quiet is
      a silent parity loss, and it is exactly the failure this project exists to
      avoid.

      Do NOT add python3.10-venv. `python3 -m venv` is broken in the image
      (ensurepip missing on jammy) and it does not matter — mach uses the vendored
      third_party/python/virtualenv.
    acceptance:
      - "a fresh container from the rebuilt image reaches `./mach build` with no manual toolchain setup"
      - "RLBox stays enabled — --without-wasm-sandboxed-libraries appears nowhere"
      - "`python3 docs/android/board.py --diff-mozconfig` still passes"
    verify: "podman build -f assets/Dockerfile.android -t librewolf-android-build ."
    effort_h: "3-6"
    skills: [ops, android, shell]
    agent_safe: yes
    isolation: none
    risk: Leaving these out means every builder and the CI job rediscovers four configure stops by hand.

  - id: LW-M0-16
    title: Add nasm to the Android image and correct the BUILD.md claim
    milestone: M0
    depends_on: [LW-M0-15, LW-M2-03]
    owns: [assets/Dockerfile.android, docs/android/BUILD.md]
    what: |
      FOUND BY THE SKEPTICAL VERIFICATION OF LW-M2-03, and confirmed independently:
      `make android-aar` cannot run from a clean checkout. The x86_64 ABI needs
      nasm; `grep -ci nasm assets/Dockerfile.android` is 0, and the built image has
      neither nasm on PATH nor $MOZBUILD_STATE_PATH/nasm. The three-ABI fat AAR was
      only produced with an ad-hoc `librewolf-android-build-nasm` image made by
      podman commit on this host — it exists in NO repo file, so nobody else can
      reproduce the deliverable.

      Worse, the requirement is currently recorded only in a comment inside
      scripts/android-fat-aar.sh, while docs/android/BUILD.md:415 still states
      "**No `nasm`/`yasm`** is needed: they are x86-only" as an unqualified bullet —
      in the very section that hands off to the image owner with "Suggested layers".
      That was true for the aarch64-only build and is false for the fat AAR.
      Whoever maintains the image will read BUILD.md, not another task's script.

      Add nasm to assets/Dockerfile.android following the established pattern
      (pinned, with the tree file:line the pin came from), rebuild, and correct
      BUILD.md. Then DELETE the ad-hoc image so nobody depends on it again.
    acceptance:
      - "assets/Dockerfile.android installs nasm, pinned, with a source comment"
      - "the rebuilt librewolf-android-build image passes scripts/android-fat-aar.sh's x86_64 preflight"
      - "BUILD.md no longer claims nasm is unnecessary, and says which ABI needs it"
      - "no ad-hoc podman-commit image is required to reproduce make android-aar"
    verify: "podman run --rm librewolf-android-build bash -lc 'command -v nasm'"
    effort_h: "1-3"
    skills: [ops, android]
    agent_safe: yes
    isolation: none
    risk: The headline M2 deliverable is currently reproducible only on one machine, and the doc actively misleads whoever would fix it.

  - id: LW-M0-13
    title: Teach enable-patch and disable-patch the split lists
    milestone: M0
    depends_on: [LW-M0-02]
    owns: [scripts/enable-patch.sh, scripts/disable-patch.sh]
    what: |
      FOUND BY LW-M0-02. Both scripts edit only assets/patches.txt, which after the
      split is a generated compatibility shim that no longer drives any build. So a
      maintainer who runs `enable-patch.sh` gets a patch that silently never reaches
      a build — fail-open, exactly landmine L4's shape. LW-M0-02 added a non-fatal
      drift warning in the patcher that surfaces it; this task fixes it. The scripts
      must ask which list a patch belongs to (or infer it and say what it inferred),
      edit that list, and regenerate the shim. Note they currently `sort` the shim,
      which is why LW-M0-02's drift check compares sets rather than sequences.
    acceptance:
      - "enable-patch.sh adds to the correct target list and the patch actually applies on the next build"
      - "disable-patch.sh removes from whichever list holds the patch"
      - "the shim stays consistent, and the patcher's drift warning stays silent after either script runs"
    verify: "./scripts/enable-patch.sh --help && ! python3 scripts/librewolf-patches.py --no-execute 153.0.4 1 2>&1 | grep -qi 'out of sync'"
    effort_h: "2-3"
    skills: [shell]
    agent_safe: yes
    isolation: none
    risk: A maintainer trusting these scripts ships a build missing the patch they just enabled, with no error anywhere.

  - id: LW-M0-06
    title: Build a pinned Android toolchain image (assets/Dockerfile.android)
    milestone: M0
    depends_on: []
    owns: [assets/Dockerfile.android]
    reads: [assets/Dockerfile]
    what: |
      Mirror assets/Dockerfile for Android: JDK, Android SDK + build-tools, NDK,
      Rust with the four Android targets (aarch64/armv7/x86_64/i686-linux-android),
      and the mach bootstrap deps. Pin every version explicitly and record the
      tree file:line each pin came from, so the next rebase can re-check.

      READ THE PINS FROM (verified — mobile/android/gradle.py holds NO version
      constants, it is a 52-line gradle invocation helper):
      python/mozboot/mozboot/android.py, python/mozboot/mozboot/android-packages.txt,
      build/moz.configure/android-sdk.configure, build/moz.configure/android-ndk.configure,
      gradle/libs.versions.toml, mobile/android/android-components/.config.yml, and
      taskcluster/kinds/toolchain/rust.yml (linux64-rust-android is the version
      Mozilla's Android builds actually use — Cargo.toml's floor is only a floor).

      Two traps: the JDK must physically live at $MOZBUILD_STATE_PATH/jdk/... because
      java.configure:29-34 ignores JAVA_HOME; and the `emulator` SDK package is NOT
      optional despite looking test-only, because android-sdk.configure:376 runs
      check_android_tools("emulator") unconditionally for mobile/android and dies
      without it.
    acceptance:
      - "every pinned version is traceable to a tree file:line recorded in a comment"
      - "`rustup target list --installed` shows all four Android targets, verified by running it inside the built image"
      - "sdkmanager --licenses runs non-interactively — the build never blocks on a prompt"
      - "the NDK revision is asserted after download, not merely requested"
    verify: "podman build -f assets/Dockerfile.android -t librewolf-android-build ."
    note: >-
      Full network hermeticity is deliberately NOT required here — the house style
      in assets/Dockerfile hits Ubuntu archives, sh.rustup.rs and codeberg. A
      hermetic image is a separate piece of work if it is ever wanted.
