  - id: LW-M6-07
    title: Make the R8-minified release build actually boot
    milestone: M6
    depends_on: [LW-M2-04]
    owns: [patches/android/r8-keep-rules.patch, scripts/android-apk.sh]
    what: |
      RELEASE BLOCKER, found incidentally by the skeptical verification of LW-M4-16
      and confirmed independently from the crash logcat. **The R8-minified release
      build crashes on launch.** Twice, reproducibly:

        FATAL EXCEPTION: main
        java.lang.Error: Structure.getFieldOrder() on class
        org.mozilla.experiments.nimbus.internal.RustBuffer$ByValue does not provide
        enough names [0] ([]) to match declared fields [3] ([capacity, data, len])
          at com.sun.jna.Structure.getFields(r8-map-id-7758...:144)

      JNA derives a native struct's layout by REFLECTING over field names. R8's
      minification renames them, so getFieldOrder() returns an empty list and every
      uniffi/Nimbus call through JNA dies before the browser starts. The
      `r8-map-id-` frames prove it is the minified build; the debug build is fine.

      WHY NOBODY NOTICED, and this is the part worth internalising: every APK the
      project has built and tested is `fenix:assembleDebug`
      (scripts/android-apk.sh:694,844 — `assembleRelease` appears nowhere in that
      file), and the two release APKs that do exist were built with
      `-PdisableOptimization`, i.e. with R8 turned off. So the configuration we
      would actually SHIP has never been booted, and the smoke harness has never
      run against it.

      Worse, it produced a confidently wrong conclusion elsewhere: LW-M4-16
      reported the release artefact "provably zero-GMS" because --check-no-gms
      exits 0 on it. It does — because R8 deleted the classes. The gate is green on
      that artefact for exactly the reason it cannot ship.

      FIX: add the JNA/uniffi keep rules (`-keepclassmembers class * extends
      com.sun.jna.Structure { <fields>; }` and whatever the Nimbus/appservices
      generated bindings need — check what Mozilla's own release config keeps),
      then boot it. Teach scripts/android-apk.sh to build a release variant so this
      is testable at all, and make the smoke harness run against the RELEASE APK
      before any signing work (LW-M6-01) begins.
    acceptance:
      - "an R8-minified release APK launches and loads a page — observed, not inferred"
      - "./scripts/android-smoke.sh passes against the RELEASE apk, not only the debug one"
      - "scripts/android-apk.sh can build a release variant without -PdisableOptimization"
      - "any --check-no-gms result is re-derived on a booting release build, since the previous one was an artefact of R8 deletion"
    verify: "./scripts/android-smoke.sh --emulator --apk <release-apk>"
    effort_h: "6-12"
    skills: [kotlin, gradle, android]
    agent_safe: yes
    isolation: worktree
    risk: The shipping configuration has never been booted; every measurement so far describes a build we would not release.

