  - id: LW-M7-03
    title: State the project's relationship to LibreWolf and IronFox honestly
    milestone: M7
    depends_on: [LW-M7-02]
    owns: [docs/android/POSITIONING.md]
    what: |
      RE-SCOPED. This task used to say "Update the FAQ and close out issue 2169",
      which assumed we are the LibreWolf project. We are not — this is an
      independent fork (see docs/android/IDENTITY.md). We cannot edit their FAQ or
      close their issues, and should not imply otherwise.

      The real task is the harder one: say clearly what this project is and is not.
      Three relationships need stating without spin:

      1. **To LibreWolf.** We ship their privacy configuration
         (settings/librewolf.cfg and the patch set, MPL-2.0) on Android. We are not
         them, they have not endorsed this, and users must not be able to mistake
         one for the other. Credit the work plainly — the config IS the product,
         and pretending otherwise would be both dishonest and ungrateful.
      2. **To IronFox.** They occupy this space already and LibreWolf's own FAQ
         points Android users there. Say what differs — honestly, including where
         IronFox is ahead. A comparison that only flatters us reads as marketing
         and ages badly.
      3. **To Firefox.** Standard downstream disclosure: not affiliated with or
         endorsed by Mozilla, and no Mozilla trademarks in the UI (LW-M4-12).

      Also record what happened with the upstream bug reports
      (docs/android/UPSTREAM-REPORTS.md) — if LibreWolf took them, say so and
      thank them; if not, the defects are still worth documenting as things this
      fork fixed.
    acceptance:
      - "a reader can tell in one sentence that this is not the LibreWolf project"
      - "the IronFox comparison names at least one thing IronFox does better"
      - "attribution to LibreWolf is prominent, not buried in a licence footer"
      - "no claim on the page contradicts docs/android/PARITY.md"
    verify: "manual: maintainer review against PARITY.md and IDENTITY.md"
    effort_h: "3-5"
    skills: [docs]
    agent_safe: yes
    isolation: none
    risk: A fork that blurs its relationship to the project it forked loses the trust that made the config worth shipping.

  - id: LW-M7-04
    title: Set up Android issue triage on github.com/CPlusPlus17/Redoubt/issues
    milestone: M7
    depends_on: []
    owns: [docs/android/TRIAGE.md]
    what: |
      Labels, an issue template that asks for device, Android version, APK source
      and channel, and a triage rotation. Do this BEFORE launch — the first week of
      reports is when the process is most needed and least likely to get written.
      Match the tracker's existing house style: the live labels on
      github.com/CPlusPlus17/Redoubt/issues are space-separated and capitalised (`Linux`,
      `Build Flatpak`, `Status Upstream`, `Needed Info`), NOT kebab-case. Compose
      with the existing ones rather than duplicating them — `Needed Info` already
      means "closing in ten days without details", which is why a complete but
      unreproduced Android report needs a different bucket or it auto-dies.
    acceptance:
      - "labels follow the tracker's existing naming style and the Android issue template is live"
      - "the template asks for device, OS version, APK source and channel"
      - "a named triage owner for the launch window"
    verify: "manual: file a test issue and confirm the template"
    effort_h: "2-4"
    skills: [ops, docs]
    agent_safe: yes
    isolation: none
    risk: Launching without triage buries real security reports in duplicate build questions.

  - id: LW-M7-05
    title: Extend the security disclosure process to Android
    milestone: M7
    depends_on: [LW-M5-06]
    owns: [docs/android/SECURITY.md]
    what: |
      Android adds failure modes desktop does not have: APK signature issues,
      distribution-channel compromise, and a device-specific attack surface. Extend
      the existing disclosure process to cover them, and state the response SLA for
      a Gecko security release given the ESR track — users need to know how fast a
      critical fix reaches them on Android.
    acceptance:
      - "the process covers signature and channel compromise"
      - "a stated turnaround target for critical Gecko security releases on Android"
      - "a contact path that does not require a Codeberg account"
    verify: "manual: maintainer review"
    effort_h: "3-5"
    skills: [docs, ops]
    agent_safe: yes
    isolation: none
    risk: Choosing ESR means a slower critical-fix path than desktop; not saying so is the problem, not the delay.

  - id: LW-M7-07
    title: Correct REBASE.md and finish retiring the compat shim
    milestone: M7
    depends_on: [LW-M7-01]
    owns:
      - docs/android/REBASE.md
      - scripts/librewolf-patches.py
      - scripts/enable-patch.sh
      - scripts/disable-patch.sh
    what: |
      Corrective task from the skeptical verification of LW-M7-01. Three defects,
      all fixed:

      (1) REBASE.md:578-582 taught a workaround for a trap in board.py
      --check-policies, and explained it wrongly — it claimed `.` (0x2E) sorts
      before `/` (0x2F), under a heading saying the claim had been confirmed by
      running it. pathlib.Path compares part tuples, so `/` is never compared as a
      character; executed, firefox-153.0 wins over firefox-153.0.4, the exact
      inverse. The ROOT CAUSE was fixed instead of the doc: --check-policies now
      errors when more than one firefox-* tree exists, honours LW_TREE, and prints
      the tree it read. The workaround was deleted rather than corrected.

      (2) Appendix A's one-block quick reference contradicted section 6d's naming
      rule, so a maintainer following the copy-paste path walked into the trap 6d
      existed to prevent. Every command block must be runnable standalone — 6c also
      consumed a /tmp file only 6b produced.

      (3) The shim was half-retired: assets/patches.txt was deleted but
      librewolf-patches.py still called check_compat_shim() and warned on every
      invocation, and enable-patch.sh/disable-patch.sh recreated the file
      unconditionally with no existence guard.

      Follow-ups outside this task's ownership, now also done: the standing
      "regenerate the shim" instruction in assets/patches/common.txt and the dead
      shim-drift block in scripts/check-patchfail.sh were removed separately.
    acceptance:
      - "no command block in REBASE.md depends on a workaround for a bug that is now fixed"
      - "every REBASE.md command block runs standalone as written"
      - "the patcher emits no shim warning and the helpers do not recreate assets/patches.txt"
      - "an enable/disable round trip leaves the three lists byte-identical and creates no shim"
    verify: "! python3 scripts/librewolf-patches.py -n 153.0esr 1 --targets=android 2>&1 | grep -qi 'shim' && test ! -e assets/patches.txt"
    effort_h: "3-5"
    skills: [docs, python, shell]
    agent_safe: yes
    isolation: none
    risk: A runbook that teaches a workaround for a fixed bug is worse than no runbook — it survives the fix and misleads.

