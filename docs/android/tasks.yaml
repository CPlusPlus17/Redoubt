  - id: LW-M1-14
    title: Fix the malformed hunk headers in always-fetch-latest-toolchain
    milestone: M1
    depends_on: []
    owns: [patches/always-fetch-latest-toolchain-artifact.patch]
    what: |
      FOUND BY LW-M1-10, verified twice. Both hunks in this patch declare line
      counts that do not match their bodies:
        @@ -9,8 +9,9 @@     declares old=8  new=9   body is old=9  new=10
        @@ -452,28 +452,30 @@ declares old=28 new=30  body is old=15 new=17
      GNU patch tolerates it (it works from the body), so `make check-patchfail` is
      green and nobody has noticed. `git apply --check` fails hard:
      "patch fragment without header at :16", exit 128.

      That matters because it silently rules out every git-based tool on the patch
      set — including scripts/git-patchtree.sh, which is already in this repo — and
      because any strict diff parser that trusts hunk headers will mis-read the
      file. LW-M1-10's parser had to work around it by using ---/+++ adjacency.

      Regenerate the headers from the actual bodies. Do not re-diff against a
      different tree; the content is correct, only the counts are wrong. This is a
      DESKTOP fix as much as an Android one.
    acceptance:
      - "`git apply --check` succeeds against a tree containing the target file"
      - "GNU patch still applies it identically — same resulting file bytes"
      - "`./scripts/check-patchfail.sh` still exits 0"
      - "no other patch in the set has the same defect (check them all while you are here)"
    verify: "./scripts/check-patchfail.sh"
    effort_h: "1-2"
    skills: [shell]
    agent_safe: yes
    isolation: none
    risk: Low to fix, but while it stands no git-based patch tooling can be used on this repo at all.

