  - id: LW-M1-12
    title: Reconcile the shim and delete the split monoliths
    milestone: M1
    depends_on: [LW-M1-02, LW-M1-03, LW-M1-04, LW-M1-05, LW-M1-06, LW-M1-07, LW-M1-08, LW-M1-09]
    owns:
      - assets/patches.txt
      - assets/patches/common.txt
      - assets/patches/desktop.txt
      - assets/patches/android.txt
      - docs/android/PATCH-SCOPE.md
      - patches/android/README.md
      - patches/disable-data-reporting-at-compile-time.patch
      - patches/eme-permission.patch
      - patches/moz-official.patch
      - patches/msix.patch
      - patches/remove-pingsender.patch
      - patches/ui-patches/neterror.patch
      - patches/webgl-permission.patch
    what: |
      CENTRAL CLEANUP, needed because all eight straddler splits hit the same
      problem and none of them can fix it alone. Each split leaves its monolithic
      patch file on disk, because check-patchfail.sh and fuzzfail.sh read only the
      generated assets/patches.txt shim — deleting the monolith before the shim is
      regenerated makes their own verify fail on a missing `-i` target. So after a
      split lands, check-patchfail is still exercising the MONOLITH, not the two
      halves, and librewolf-patches.py prints its out-of-sync warning.

      Do it once, after all eight land: regenerate the shim with
      `sed -e 's/#.*//' -e 's/[[:space:]]*$//' assets/patches/common.txt assets/patches/desktop.txt | grep . > assets/patches.txt`
      (the exact command check_compat_shim() prints), delete the eight monoliths,
      and reconcile PATCH-SCOPE.md's counts and its live-list table — every split
      moves one entry from desktop into common and adds a file, so both the
      `N common / N desktop-only / N straddlers = N` line and the per-list table
      need recomputing. `board.py --check-scope` enforces that they agree.

      While in PATCH-SCOPE.md, fix one justification LW-M1-06 disproved: the
      LW-M1-06 row says pingsender/moz.build "still appends
      pingsender_unix_common.cpp to UNIFIED_SOURCES outside that guard", implying
      compiled code on Android. Textually true but nothing compiles — with
      GeckoProgram skipped there is no linkable in that context and no
      FINAL_LIBRARY, so emitter.py:1038-1042 returns before emitting any source.
      The classification (common) is right; the mechanism is that the directory
      stops being traversed. Fix the reason, keep the verdict.

      Also correct the LW-M1-07 row, which LW-M1-07 disproved. It claims the
      common half "yields a broken image reference" on Android. It does — but
      upstream already does the same: unpatched net-error-illustrations.mjs points
      at security-error.svg and no-connection.svg, packaged only by
      desktop-jar.inc.mn:148,151. The patch swaps one desktop-only-packaged
      illustration for another, so it is NOT a new Android regression and NOT
      L1-shaped (L1 changes behaviour; this changes nothing reachable — the whole
      component is gated on security.certerrors.felt-privacy-v1, set only in
      browser/app/profile/firefox.js:2965, and Fenix answers every load error with
      its own ErrorPages document anyway).

      Record the trap-within-the-trap while you are there, because it will bite the
      next person who adds a mobile jar entry: it must go in
      toolkit/themes/mobile/global/jar.mn and NEVER in
      shared/minimal-toolkit.jar.inc.mn — desktop-jar.inc.mn:10 includes the latter,
      so an entry there lands in the desktop jar too and breaks byte-identity.

      Finally, assets/patches/android.txt's header still says "DELIBERATELY EMPTY".
      It is not — several Android patches now live there.

      COUNT CHANGES you must fold in, beyond the per-split arithmetic:
      LW-M1-05 resolved msix to a plain desktop-only patch, NOT a straddler, so the
      straddler count drops by one independently of any split. The desktop.txt
      header's "Seven entries edit both shared Gecko code and browser/" is wrong on
      two counts now. And LW-M1-09 folded xmas into the lists, so only
      pref-pane-small is still applied from its own call site — board.py now
      derives that set from librewolf-patches.py rather than hardcoding it, but the
      prose in PATCH-SCOPE.md still describes the old two-patch situation.
    acceptance:
      - "assets/patches.txt equals common+desktop and librewolf-patches.py prints no out-of-sync warning"
      - "no monolithic straddler patch file remains on disk"
      - "check-patchfail exercises the split halves, not the monoliths — verified by checking the applied list"
      - "`python3 docs/android/board.py --check-scope` exits 0"
    verify: "python3 docs/android/board.py --check-scope && ./scripts/check-patchfail.sh"
    effort_h: "2-3"
    skills: [shell, docs]
