  - id: LW-M4-16
    title: Remove the two residual GMS strings so --check-no-gms passes
    milestone: M4
    depends_on: [LW-M4-05]
    owns: [patches/android/no-gms.patch]
    what: |
      LW-M4-05's own verify does not pass, and the implementing agent honestly did
      not claim it did: `./scripts/android-smoke.sh --check-no-gms --apk <apk>` exits
      1 with "2 distinct GMS strings ... and 0 apk entries". Acceptance line 1 ("no
      com.google.android.gms references in the built APK") is literally unmet.

      Note the gate was NOT softened to accommodate this — scripts/android-smoke.sh
      predates the task's work window by hours and still requires total==0. That is
      the right outcome: the harness held.

      Identify the two survivors, determine whether they are live code paths or
      inert strings (a class name in a manifest attribute, a ProGuard rule, a
      resource), and either remove them or — if they are provably unreachable —
      make the check's contract explicit about what it counts and why those two are
      acceptable. Do NOT simply relax the threshold to 2; a gate that moves to meet
      the code is not a gate.

      This matters beyond tidiness: zero GMS is a hard requirement for F-Droid
      inclusion (LW-M6-03).

      STILL OPEN, and the proposed fix must NOT be applied as offered. The
      skeptical verification produced a CONCRETE FALSE PASS from it:
      /home/mgysin/lw-m4-16/android-smoke-no-gms.diff introduces `_DEX_INSN_WIDTH`,
      a linear-sweep disassembler whose opcode width table is wrong, so the reader
      scan desynchronises and can report a clean APK that is not. It also gates the
      scan on dex files whose STRING TABLE contains a GMS literal — 1 of 36 dexes on
      the combined APK.

      That is precisely the failure this task's brief warned against: a gate that
      moves to meet the code is not a gate. The honest options remain (a) remove the
      two survivors, or (b) keep them and have the check name them individually with
      the reason each is unreachable. A hand-rolled dex disassembler is neither, and
      it converts a currently-honest red into a possibly-dishonest green.

      SECOND ATTEMPT ALSO FELL SHORT, in a more interesting way. Route (a) was
      correctly established as unavailable — the two survivors are the static-field
      VALUES of GMS_ACTION_PICK_IMAGES / GMS_EXTRA_PICK_IMAGES_MAX on
      androidx.activity's ActivityResultContracts$PickVisualMedia, and a complete
      dexdump of all 36 dexes (63,646 class records, verified against the per-dex
      header counts) shows zero const-string materialising either literal, zero
      sget/sput on either field, and no Lcom/google/android/gms/ descriptor
      anywhere. They are genuinely inert in the shipped version.

      But the proposed ALLOWLIST was broken with a real artefact. The verifier built
      an APK from androidx.activity 1.8.2 — the version where getGmsPicker is LIVE
      code that hands off to the Play Services photo picker — and that live path
      references NO gms descriptor at all; the two allowlisted strings are its only
      trace. So the unmodified gate correctly FAILS that APK while the proposed
      allowlist PASSES it. A dependency downgrade, or upstream reinstating the
      fallback, silently turns GMS back on with the gate green. A positive control
      (an unrelated GMS literal in a second dex) does fail correctly, so the
      allowlist is not vacuous — its blind spot is exactly one case, and it is the
      historically real one.

      HARDENING THE ALLOWLIST NEEDS: also assert the declaring class exposes no
      getGmsPicker/isGmsPickerAvailable member, or pin the androidx.activity
      version so a downgrade is itself a build failure. Either makes the exemption
      safe; naming the strings alone does not.

      AND NOTE THE ARTEFACT PROBLEM, now LW-M6-07: the "release build is provably
      zero-GMS" conclusion came from an APK that does not boot. R8 stripped the JNA
      field names Nimbus needs, so the gate was green because the classes were
      deleted. Re-derive any release-build GMS claim on a build that actually runs.

      CLOSED 2026-08-22 — the ground moved. The fresh full-patch-list release build
      (lw-fresh-2026-08-22, HEAD 5d8af8f) has GMS = 0: `--check-no-gms` passes on a
      build that boots (0 com/google/android/gms dex strings, 0 apk entries). The two
      residual strings this task existed to remove are gone, so the allowlist it was
      hardening is unnecessary — the gate now holds on its own, with no exemption and
      no threshold change. Satisfied on the reference artefact; see the 4-day report.
    acceptance:
      - "./scripts/android-smoke.sh --check-no-gms exits 0 against a freshly built APK"
      - "if any string is kept, the check documents precisely why it is unreachable"
      - "the threshold is not relaxed to make a failing build pass"
    verify: "./scripts/android-smoke.sh --check-no-gms --apk <path-to-built-apk>"
    effort_h: "2-4"
    skills: [kotlin, gradle, android]
    agent_safe: yes
    isolation: worktree
    risk: F-Droid inclusion requires zero GMS; shipping with two survivors means discovering this at submission.

