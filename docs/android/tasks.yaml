    tree_paths:
      - dom/media/eme/MediaKeySystemAccessManager.cpp
      - browser/components/permissions/ContentPermissionPrompt.sys.mjs
      - browser/modules/EMEPermissionPrompt.sys.mjs
    what: |
      MediaKeySystemAccessManager.cpp is the enforcement point and is common; the
      two browser/ files are the desktop prompt UI. Split them.

      RESOLVED BY LW-M1-03, and the premise this task was written on was WRONG.
      "Android has no equivalent surface yet" is false: Fenix has implemented this
      exact permission type end to end all along — GeckoViewPermission.sys.mjs:119-219
      is type-agnostic and forwards any perm.type to the embedder (the structural
      difference from webgl-permission, whose observers exist only under browser/),
      GeckoSession.java carries PERMISSION_MEDIA_KEY_SYSTEM_ACCESS across JNI, and
      Fenix has both a doorhanger and a settings entry (PhoneFeature.kt:38,
      SitePermissionsRules.kt:92-94, default ASK_TO_ALLOW). No Android patch needed.

      The one deliberate silent deny is Clear Key, and it is identical on both
      platforms — the pref is read as
      Preferences::GetBool("librewolf.eme.gmp-clearkey.enabled", false), so the
      built-in fallback already equals LibreWolf's default. That is exactly why
      webgl-permission needed an Android patch and this does not: webgl's shared
      default was the permissive-looking true.

      The real remaining gap is narrower: there is no Android surface for the
      LibreWolf-specific Clear Key denial (desktop's learn-more link to
      librewolf.eme.warning.infoURL). That is a UI follow-up, not a scope question.
    acceptance:
      - "desktop tree byte-identical after the two patches"
      - "common patch applies with no browser/ present"
      - "chosen Android behaviour recorded in the common patch header"
    verify: "./scripts/check-patchfail.sh"
    effort_h: "2-4"
    skills: [c++, js]
    agent_safe: yes
    isolation: worktree
    risk: Enforcement without any user-visible signal reads as a broken video player.

