  # ---------------------------------------------------------------- M7
  # Launch and sustain. Mostly docs and process; all parallel.

  - id: LW-M7-01
    title: Write the esr153 rebase runbook and retire the compat shim
    milestone: M7
    depends_on: [LW-M1-11, LW-M0-07, LW-M1-12, LW-M1-13]
    owns: [docs/android/REBASE.md, assets/patches.txt]
    what: |
      The rebase runbook for an ESR dot release: fetch and verify the tarball,
      run check-patchfail for both targets, fix rejects, run the pref audit and
      smoke test, build, sign, publish. Include the "what changed upstream that
      could silently revert one of our prefs" check — that is the failure mode a
      rebase actually produces. Also retire the assets/patches.txt compatibility
      shim from LW-M0-02 once all downstream builders have moved.
    acceptance:
      - "a new maintainer can complete a dot-release rebase from the runbook alone"
      - "the runbook names the pref-audit and smoke-test gates explicitly"
      - "the shim is removed and no builder references it"
    verify: "manual: a maintainer who did not write it completes one rebase using only the runbook"
    effort_h: "6-10"
    skills: [docs, shell]
    agent_safe: yes
    isolation: none
    risk: An undocumented rebase makes the whole project bus-factor-1, which is the exact criticism levelled at the alternatives.

