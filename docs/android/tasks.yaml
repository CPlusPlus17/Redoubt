# Redoubt — task board
#
# Source of truth for the port. Human narrative lives in ROADMAP.md; the working
# agreement for agents lives in AGENTS.md. Validate this file with:
#
#     python3 docs/android/board.py --check
#
# Schema (every field required unless marked optional):
#   id           LW-M<milestone>-<nn>, stable forever, never renumbered
#   title        imperative, <= 70 chars
#   milestone    M0..M7
#   depends_on   task ids that must be DONE before this one starts
#   owns         paths in THIS repo (or the settings submodule) the task may write.
#                Two tasks in the same wave must never share an owned path.
#   shared_edit  append-only, line-oriented files (the patch lists) that several
#                tasks legitimately touch at once. Exempt from collision checking.
#                Rule: only ever add or change the line for YOUR OWN patch.
#                (optional, default [])
#   tree_paths   files inside the extracted Firefox tree that this task's patches
#                touch. Also collision-checked — two patches editing the same tree
#                file must be ordered, not parallel.  (optional, default [])
#   reads        paths the task needs to read but must not modify (optional)
#   what         2-5 sentences. Names concrete files, functions, line numbers.
#   acceptance   machine-checkable criteria, all must hold
#   verify       one shell command, or "manual: <what a human must do>"
#   effort_h     rough range in hours for one competent agent/engineer
#   skills       python|make|c++|js|kotlin|gradle|rust|shell|android|design|docs|ops
#   agent_safe   yes = a fresh agent with no prior context can do it from this file
#   isolation    none | worktree  (worktree when the task mutates the source tree)
#   risk         one line: what goes wrong if this is done carelessly
#
# NOTE ON THE settings SUBMODULE
#   settings/ is a git submodule (github.com/CPlusPlus17/Redoubt/settings). Tasks that own
#   paths under settings/ produce a PR in THAT repo plus a submodule bump here.
#   They are marked with `submodule: settings`.

meta:
  project: Redoubt
  strategy: full parity — Gecko built from source, one shared patch set with desktop
  decided: 2026-08-14
  track: esr153 for Android while desktop stays on release (see LW-M0-07)
  forge: codeberg.org (no GitHub mirror; upstream is read-only from
    github.com/mozilla-firefox/firefox)
  patch_scope_snapshot: 22 common / 23 desktop / 8 straddlers of 53 patch files
    (heuristic — LW-M1-01 produces the authoritative split)

tasks:

  # ---------------------------------------------------------------- M0
  # Foundations. Everything here is agent-safe, needs no Gecko build, and
  # (apart from the stated deps) runs in parallel. This is the widest wave.

  - id: LW-M0-01
    title: Add a TARGETS variable to the Makefile and thread it to the patcher
    milestone: M0
    depends_on: []
    owns: [Makefile]
    reads: [scripts/librewolf-patches.py]
    what: |
      Makefile:136-140 builds $(lw_source_dir) by calling
      `python3 scripts/librewolf-patches.py $(version) $(release)` with no notion
      of a platform. Add `TARGETS ?= desktop` and pass `--targets=$(TARGETS)`.
      Add the variable to the $(lw_source_dir) prerequisite list so changing it
      forces a re-extract. Do not change patcher behaviour in this task — only
      the plumbing, so `make dir` with no TARGETS is byte-identical to today.
    acceptance:
      - "`make dir` with no arguments produces the same tree as before this change"
      - "`make -n dir TARGETS=desktop,android` shows the patcher invoked with --targets=desktop,android (the runtime half is gated on LW-M0-02, which adds the flag to the patcher)"
      - "the TARGETS value participates in the $(lw_source_dir) prerequisites — directly or via a TARGETS-derived stamp — so changing it forces a re-extract"
    verify: "make -n dir TARGETS=desktop,android | grep -- '--targets=desktop,android'"
    effort_h: "1-2"
    skills: [make]
    agent_safe: yes
    isolation: none
    risk: Silently changing the default target breaks every existing desktop builder.

  - id: LW-M0-02
    title: Split patches.txt into common/desktop/android lists
    milestone: M0
    depends_on: [LW-M0-01, LW-M0-05]
    owns:
      - assets/patches/common.txt
      - assets/patches/desktop.txt
      - assets/patches/android.txt
      - assets/patches.txt
      - scripts/librewolf-patches.py
      - Makefile
    what: |
      Add `--targets` to scripts/librewolf-patches.py (optparse block at :22-25).
      LW-M0-01 left a conditional in the Makefile that suppresses the flag when
      TARGETS is the default, precisely because the patcher rejects it today —
      once this task lands, that conditional can be removed and the flag passed
      unconditionally. Do that, and delete the comment that explains it.
      Replace the single read of ../assets/patches.txt at :115-117 with: always
      apply common.txt, then apply desktop.txt and/or android.txt per --targets.
      Keep assets/patches.txt as a generated compatibility shim (common+desktop
      concatenated) until LW-M7-01 retires it. Seed the three lists from the
      current 51 entries using the heuristic in PATCH-SCOPE.md; LW-M1-01 corrects
      it. The separately-applied patches at :121 (xmas) and :145 (pref-pane) stay
      where they are for now — LW-M1-09 and LW-M1-10 move them.

      Two pre-existing defects found by LW-M0-04 land in your lap because you own
      this file. `--no-execute` is NOT side-effect-free today: the version.txt
      rewrite (`:224-226` after the M0-04 change) runs unconditionally and really
      writes `browser/config/version.txt`, and `open('../assets/patches.txt')` is
      read relative to cwd even though `enter_srcdir()` did not chdir under -n. Fix
      both — a dry run that mutates the tree makes this task's own verify command
      impossible to write. Also gate the `srcdir + '/configure.py'` existence check
      at the bottom of the script on `no_execute`.

      Finally, in the Makefile (which you now own): add `assets/l10n-pin.txt` to the
      `$(lw_source_dir)` prerequisite list so bumping the pin re-triggers patching,
      and drop the `ifneq ($(TARGETS),desktop)` conditional around `patcher_cmd`
      that LW-M0-01 left as a bridge.

      Also stale in your file: the comment at librewolf-patches.py:124-127 still
      cites ".rej-only detection" as a live reason for keeping the OpenAI deletions
      in Python. LW-M0-11 fixed that detector. The size argument still stands —
      only the detector claim is outdated. Correct the comment, keep the code.

      Two more Makefile items, both found by LW-M0-07. First, a pre-existing bug:
      `ff_source_tarball` is assigned TWICE (once with `$(FF_BETA_SUFFIX)`, once
      without); the second assignment wins, so FF_BETA_SUFFIX has no effect on the
      tarball name and `make test-beta` cannot work. Second, `targets_stamp` is
      version-agnostic and its recipe does `rm -f librewolf-targets-*`, so now that
      Android pins its own version, every TARGETS switch re-extracts a tree that
      was already correct — about 10GB of churn. TRACK.md has a two-line fix; it
      renames the stamp, so it must land with a note that the first `make dir`
      after it re-extracts once.

      (Non-issue, recorded so nobody re-investigates: assets/mozconfig and
      assets/mozconfig.new look like duplicates but mozconfig is a SYMLINK to
      mozconfig.new. The patcher copies mozconfig.new and the Makefile lists
      assets/mozconfig as the prerequisite; make follows the link, so this is
      correct as-is. Leave it alone.)
    acceptance:
      - "common.txt + desktop.txt == the current patches.txt set (as a set, order preserved within each)"
      - "`make dir` (default targets) applies exactly the same patches in the same order as before"
      - "--targets=android applies common.txt + android.txt and no browser/-only patch"
      - "patcher exits non-zero on an unknown target name"
      - "`--no-execute` writes nothing to disk and works from any cwd"
      - "assets/l10n-pin.txt is a prerequisite of $(lw_source_dir)"
    verify: "cd /tmp && python3 $OLDPWD/scripts/librewolf-patches.py --no-execute --targets=android 153.0.4 1 | grep -c 'patch -p1'"
    effort_h: "3-5"
    skills: [python, shell]
    agent_safe: yes
    isolation: none
    risk: Order within the common list is load-bearing — see AGENTS.md "patch ordering".

