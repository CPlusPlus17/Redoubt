  - id: LW-M3-08
    title: Spike — make autoconfig itself work on Android
    milestone: M3
    depends_on: [LW-M1-09, LW-M2-04]
    owns: [docs/android/AUTOCONFIG-SPIKE.md, patches/android/autoconfig-resource-fallback.patch]
    what: |
      RUN THIS BEFORE LW-M3-02 BUILDS ANYTHING. If it succeeds, LW-M3-02 and
      LW-M3-03 shrink to almost nothing and landmine L2 largely dissolves.

      The plan assumed autoconfig is unreachable on Android. Tracing it exactly
      (LW-M1-09 found the packaging half, the rest verified against the tree) the
      blocker is ONE code path, not the mechanism:
        - nsReadConfig.cpp:170 loads prefcalls.js with isBinDir=FALSE, which uses
          `resource://gre/defaults/autoconfig/` — a resource: URI that resolves
          inside the APK. It already works, and
          mobile/android/installer/package-manifest.in:136 already packages
          `@BINPATH@/defaults/autoconfig/prefcalls.js`.
        - nsReadConfig.cpp:192 loads the actual .cfg with isBinDir=TRUE, which goes
          through NS_GetSpecialDirectory(NS_GRE_DIR) at :261. That is the dead end:
          nsXREDirProvider.cpp:390-395 returns nothing for NS_GRE_DIR under
          MOZ_WIDGET_ANDROID, commented "internal files are inside the APK, a zip
          file, so this folder doesn't really make sense."

      So the .cfg cannot be found, but everything else already works. Try making
      the isBinDir path fall back to `resource://gre/` when NS_GRE_DIR is
      unavailable, and package librewolf.cfg + local-settings.js into the Android
      manifest (note it is an explicit file list with no root wildcard, so each
      file must be named — PdfJsDefaultPrefs.js proves the defaults/pref channel
      works that way).

      WHY THIS MATTERS SO MUCH — and it is now stronger than when this task was
      written. `MOZ_DEFAULT_PREFS` as shipped carries no lock: `GeckoLoader` emits
      only bare `pref()` lines with no `locked` attribute (the parser does support
      the attribute — modules/libpref/parser/src/lib.rs:30 — but the channel never
      uses it). So the fallback plan cannot express the 38 `lockPref`s in common.cfg,
      and landmine L2's own prescribed mitigation is unavailable through that channel.

      Autoconfig's `lockPref` calls `Preferences::Lock` directly. If the .cfg is
      evaluated natively, locking works, Android ships the SAME file as desktop
      rather than a compiled derivative, and the 26 bare `pref()` calls keep their
      real user-branch semantics instead of being silently downgraded to defaults.
      If this spike succeeds it is not an optimisation — it is the difference
      between parity and approximation.

      Time-box it. If it does not work, say why precisely and hand LW-M3-02 the
      reason — a failed spike with a clear diagnosis is a good outcome here.
    acceptance:
      - "a definitive answer on whether librewolf.cfg can be evaluated natively on Android"
      - "if yes: a pref set only by the .cfg is observable in about:config on a real build"
      - "if yes: a lockPref'd pref demonstrably survives the Fenix settings screen that would otherwise overwrite it"
      - "if no: the exact failing call and why, written up for LW-M3-02"
    verify: "manual: pref dump from a running build, before and after opening settings"
    effort_h: "6-12"
    skills: [c++, android, js]
    agent_safe: yes
    isolation: worktree
    risk: Skipping this spike means building a whole cfg compiler and lock generator that may be unnecessary.

  - id: LW-M3-02
    title: Land the autoconfig channel on Android
    milestone: M3
    depends_on: [LW-M3-01, LW-M3-08]
    owns:
      - patches/android/autoconfig-resource-fallback.patch
      - assets/patches/android.txt
      - docs/android/PATCH-SCOPE.md
      - docs/android/AUTOCONFIG-SPIKE.md
      - scripts/check-patch-order.py
    reads: [settings/common.cfg, settings/android.cfg]
    what: |
      REWRITTEN AFTER LW-M3-08 SUCCEEDED. This task was "write a compiler that
      turns librewolf.cfg into MOZ_DEFAULT_PREFS lines". That is no longer the
      plan, and building it would have been ~20 hours spent on the wrong thing.

      The spike proved autoconfig itself works on Android. Land it:
        1. patches/android/autoconfig-resource-fallback.patch — currently ON DISK
           but in NO list (declared pending in PATCH-SCOPE.md). It makes
           nsReadConfig's isBinDir lookup fall back to `resource://gre/` when
           NS_GRE_DIR is empty, which is the single dead end on Android
           (nsXREDirProvider.cpp:390-395 returns nothing there by design).
        2. Package librewolf.cfg and local-settings.js BY NAME in
           mobile/android/installer/package-manifest.in. It is an explicit file
           list with no root wildcard — PdfJsDefaultPrefs.js at :113 is the
           precedent, and prefcalls.js at :136 already ships.
        3. Declare the new ordering constraint in scripts/check-patch-order.py:
           xmas-common before autoconfig-resource-fallback, both touching
           lw/moz.build. The spike's verification confirmed check-patch-order
           flags this pair and demands it be declared.
        4. Remove the pending declaration from PATCH-SCOPE.md and fix its counts.

      TWO CORRECTIONS the spike's own artefacts still carry, fix them as you land:
      the patch comment claims isBinDir decides skipFirstLine — it does not
      (nsReadConfig.cpp:343 feeds `isEncoded` to that argument; isBinDir feeds
      isPrivileged only), and AUTOCONFIG-SPIKE.md section 12 says the patch is in
      android.txt when section 8 correctly says it is not.

      Until this lands, both check-patchfail runs pass VACUOUSLY with respect to
      that patch — nothing applies it, so a rebase would not notice it breaking.
    acceptance:
      - "the autoconfig patch is in assets/patches/android.txt, not merely on disk — both check-patchfail runs must actually apply it"
      - "librewolf.cfg and local-settings.js are packaged by name in the Android manifest"
      - "the xmas-common -> autoconfig-resource-fallback ordering constraint is declared in check-patch-order.py"
      - "a pref set only by librewolf.cfg is observable in about:config on a fresh profile of a RUNNING build"
      - "PATCH-SCOPE.md no longer lists the patch as pending and its counts agree with the lists"
    verify: "python3 docs/android/board.py --check-scope && python3 scripts/check-patch-order.py && ./scripts/check-patchfail.sh --targets=android --use-desktop-tarball"
    effort_h: "8-14"
    skills: [python, js]
    agent_safe: yes
    isolation: none
    risk: Silently skipping a construct it cannot parse drops prefs with no error — fail loud, always.

  - id: LW-M3-03
    title: Decide what remains of the MOZ_DEFAULT_PREFS channel
    milestone: M3
    depends_on: [LW-M3-02, LW-M2-04]
    owns: [patches/android/pref-delivery.patch]
