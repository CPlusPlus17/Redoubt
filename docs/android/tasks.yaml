  - id: LW-M0-11
    title: Make check-patchfail respect patch's exit code
    milestone: M0
    depends_on: [LW-M0-05]
    owns: [scripts/check-patchfail.sh, patches/remove-openai.patch]
    what: |
      FOUND BY LW-M0-05, WITH A WORKING COUNTER-DEMO. check-patchfail.sh:32-47
      discards `patch`'s exit code entirely and detects failure only by
      `grep -n 'rej$'` on the output. When a hunk's target file is missing, patch
      prints "Skipping patch. / 1 out of 1 hunk ignored", writes NO .rej file, and
      exits 1 — and check-patchfail reports success. stderr is not captured into
      patch.tmp either. Any pure-deletion or pure-addition patch is therefore
      silently fail-open, which is landmine L4's shape in the tool that is supposed
      to catch L4. Make the exit code authoritative, capture stderr, and keep the
      .rej scan as a second signal rather than the only one.

      While in the area: remove-openai.patch misses two NIGHTLY_BUILD-guarded
      references to vendor/openai/dist/openai-dev.mjs (jar.mn:43,
      license.html:1535). Harmless on release, breaks packaging on a nightly-channel
      build after the rm. Fix or document. Note jar.mn currently applies with
      fuzz 2 — pre-existing, do not paper over it.
    acceptance:
      - "a patch whose target file is missing makes check-patchfail report failure"
      - "patch's stderr appears in the output it scans"
      - "the existing .rej detection still fires (do not replace one narrow signal with another)"
      - "a run against the pristine 153.0.4 tree still reports success"
    verify: "./scripts/check-patchfail.sh"
    effort_h: "2-4"
    skills: [shell]
    agent_safe: yes
    isolation: worktree
    risk: This tool is the safety net for every other patch task; while it fails open, every green result it gives is unreliable.

