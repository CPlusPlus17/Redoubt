      GeckoRuntimeSettings construction and confirm with a pref dump.
    acceptance:
      - "prefs from common.cfg are observable in about:config on first run, before any UI interaction"
      - "a pref Fenix sets at runtime is demonstrated to override an unlocked defaultPref (documents the need for LW-M3-04)"
      - "startup time regression measured and under 50ms"
    verify: "./scripts/android-smoke.sh --pref-dump | diff - docs/android/expected-prefs.txt"
    effort_h: "6-12"
    skills: [kotlin, java, android]
    agent_safe: yes
    isolation: worktree
    risk: Getting the ordering backwards produces a build where prefs look right at startup and drift the moment the user opens settings.

  - id: LW-M3-09
    title: Fix the bare pref() calls that ResetUserPrefs wipes on Android
    milestone: M3
    depends_on: [LW-M3-02]
    submodule: settings
    owns: [settings/common.cfg, settings/android.cfg, docs/android/parity/bare-prefs.md]
    what: |
      FOUND BY LW-M3-08, and it is landmine L2b. Autoconfig now works on Android,
      but `GeckoView:ResetUserPrefs` fires at startup AFTER autoconfig has run and
      clears the USER branch — and a bare `pref()` in a .cfg writes the user branch,
      not the default one (prefcalls.js:12-18).

      Measured on the running build: only 16 of 25 bare `pref()` calls persisted.
      The clearest casualty is `browser.contentblocking.category`, which reads
      `standard` in about:config despite `pref(..., "strict")` at common.cfg:117 —
      i.e. Android silently gets Fenix's tracking-protection default instead of
      LibreWolf's. On desktop the same line works, so this is a genuine
      platform-specific privacy regression that no build error reveals.

      We ship 24 bare `pref()` calls in common.cfg. For each, decide: promote to
      `defaultPref` (survives, but is then overridable by the user, which for some
      of these is the intent), promote to `lockPref` (survives and beats Fenix, but
      over-locking makes visible settings toggles dead — see LW-M3-04's must-not-lock
      allowlist), or leave as `pref()` because being user-branch and resettable is
      genuinely what is wanted. Record the reason per pref.

      DESKTOP MUST NOT CHANGE. A bare `pref()` promoted to `defaultPref` changes
      desktop semantics too — the value stops being written to the user branch on
      every startup. Where the desktop behaviour is load-bearing, the promotion
      belongs in android.cfg with the bare `pref()` kept in common.cfg, not a
      blanket rewrite. `board.py --check-cfg-split` enforces the conservation
      counts, so it will catch a careless bulk edit.

      TWO THINGS THE VERIFICATION FOUND, both to fix before this is done.
      (1) docs/android/parity/bare-prefs.md claims a "controlled A/B, one variable"
      but the two APKs were not built from the same base — the recurring
      "a run labelled measured that was a different run than described" failure.
      Re-measure properly or restate the claim to match what was actually done.
      (2) The declared verify is VACUOUS, proven by execution:
      `board.py --check-cfg-split && android-smoke.sh --pref-dump` passes whether or
      not the fix works, because --pref-dump prints prefs without asserting any. The
      verify must assert the VALUE — browser.contentblocking.category must read
      LibreWolf's value on a running Android build, not merely appear in a dump.

      Note LW-M3-10 now owns the reason none of this reaches a device yet: the
      patcher copies common+desktop to every target, so android.cfg is not shipped.
      This task's fix is correct and currently inert; do not let that hide a
      measurement failure.
    acceptance:
      - "every one of the 24 bare pref() calls has a stated disposition and reason"
      - "the 9 measured casualties are fixed, verified on a running build not by reading"
      - "browser.contentblocking.category reads LibreWolf's value in about:config on Android"
      - "desktop's effective prefs are unchanged — proven, not asserted"
      - "python3 docs/android/board.py --check-cfg-split exits 0"
    verify: "python3 docs/android/board.py --check-cfg-split && ./scripts/android-smoke.sh --pref-dump"
    effort_h: "6-10"
    skills: [js, android]
    agent_safe: yes
    isolation: worktree
    risk: Android currently ships Fenix's tracking-protection default while the config says strict, and nothing warns.

  - id: LW-M3-10
    title: Ship the common+android cfg composition, not the desktop one
    milestone: M3
    depends_on: [LW-M3-02, LW-M3-09]
    owns: [scripts/librewolf-patches.py]
    what: |
      LIVE GAP, and it undercuts most of M3's value. `scripts/librewolf-patches.py:376`
      does `cp -v ../../settings/librewolf.cfg .` UNCONDITIONALLY, and
      settings/librewolf.cfg is by construction `common.cfg + desktop.cfg`. So the
      autoconfig channel LW-M3-02 landed works perfectly — and delivers the DESKTOP
      composition to Android.

      Two consequences, both currently shipping:
        - everything in settings/android.cfg is absent. That includes LW-M3-09's
          L2b fixes (the lockPref overrides that stop ResetUserPrefs wiping
          browser.contentblocking.category) and LW-M3-06's policy translations
          (media.eme.enabled false, network.lna.block_trackers true). The Android
          build has none of them.
        - desktop-only prefs ARE shipped. The M3-02 verification observed
          `privacy.resistFingerprinting.letterboxing` present in about:config on
          Android, which is one of the prefs LW-M3-01 moved to desktop.cfg
          precisely because it is meaningless there.

      Compose per target: `common + desktop` for desktop (byte-identical to today's
      settings/librewolf.cfg — prove it), `common + android` for android. Note the
      fragments are concatenated and evaluated IN ORDER, so android.cfg's overrides
      must come after common.cfg's; that ordering is the whole mechanism by which
      the L2b fix works, and board.py --check-cfg-split rule C is written around it.

      Watch the first line: common.cfg starts with the sacrificial `null;` that
      autoconfig's skipFirstLine eats. Whatever you concatenate must keep exactly
      one of those at the top and none in the middle — --check-cfg-split rule E
      checks the fragments for this, but not your generated output.
    acceptance:
      - "the desktop tree's lw/librewolf.cfg is byte-identical to today's settings/librewolf.cfg"
      - "the android tree's is common.cfg + android.cfg, in that order"
      - "on a running Android build, a pref set only in android.cfg is observable in about:config"
      - "letterboxing and the other desktop-only prefs are ABSENT from the android build"
      - "python3 docs/android/board.py --check-cfg-split exits 0"
    verify: "python3 docs/android/board.py --check-cfg-split && ./scripts/android-smoke.sh --pref-dump"
    effort_h: "3-6"
    skills: [python, js, android]
    agent_safe: yes
    isolation: worktree
    risk: Every Android-specific pref decision made in M3 is currently absent from the build, and the desktop-only ones are present.

  - id: LW-M3-11
    title: Make the packaged librewolf.cfg actually evaluate on Android
    milestone: M3
    depends_on: [LW-M3-08, LW-M3-10]
    owns: [patches/android/autoconfig-resource-fallback.patch]
    what: |
      The autoconfig-resource-fallback.patch (LW-M3-08) is present in the build
      tree, MOZ_WIDGET_ANDROID is defined, and the `opened` log string is in the
      compiled libxul.so. Yet on both the debug and release APKs the MCD log
      (MOZ_LOG=MCD:5) shows:

        D/MCD general.config.filename = librewolf.cfg
        D/MCD evaluating .cfg file librewolf.cfg with obscureValue 0
        D/MCD error evaluating .cfg file librewolf.cfg 80520012

      with NO `opened resource://gre/defaults/autoconfig/...` line and the
      `Autoconfig is sandboxed by default` console warning. 0x80520012 is
      NS_ERROR_FILE_NOT_FOUND. The LW-M3-08 canary proof
      (lockPref("librewolf.cfg.version","8.6")) returns cfg_applied=false on
      both builds: the canary is unset, no lockPref from the .cfg is active,
      and privacy.resistFingerprinting is not true.

      LW-M3-08's AUTOCONFIG-SPIKE.md Proof 1 shows a different MCD trace (both
      `opened` lines at 0x0, no error) from a hand-composed .cfg with sentinel
      prefs. That trace is not reproducible on the current builds: the same
      code, the same omni.ja contents, the same MOZ_LOG level, produces a
      FILE_NOT_FOUND on the .cfg and no `opened` line at all. The spike's
      verdict ("YES, librewolf.cfg can be evaluated natively on Android") is
      not supported by the current evidence.

      Determine, on a running build, why openAndEvaluateJSFile returns
      NS_ERROR_FILE_NOT_FOUND for librewolf.cfg when fromResourceURI is true
      and the resource:// branch is taken. The spike's §2.1 established that
      NS_GetSpecialDirectory(NS_GRE_DIR) succeeds on Android (returns the APK
      lib/ dir), so the pre-patch file-branch failure is understood; the
      post-patch resource:// branch failure is not. The `opened` log line
      sits after channel->Open, so its absence means the failure is in
      NS_NewURI or NS_NewChannel, or the code is not reaching the resource://
      branch despite fromResourceURI=true (a build or preprocessor issue).
      Pin the exact failing call with MOZ_LOG evidence from a running build,
      then fix it.
    acceptance:
      - "on a running debug APK, MOZ_LOG=MCD:5 shows `opened resource://gre/defaults/autoconfig/librewolf.cfg: 0x0` and no `error evaluating` line"
      - "on a running release APK, the same two conditions hold"
      - "lockPref(\"librewolf.cfg.version\",\"8.6\") from the packaged .cfg is observable as a locked pref in about:config on both builds"
      - "a defaultPref from the packaged .cfg (e.g. privacy.resistFingerprinting true) is observable in the running build's prefs on both builds"
      - "no `Autoconfig is sandboxed by default` console warning in logcat on either build"
    verify: "adb logcat -d | grep -E 'D/MCD|Autoconfig' && ./scripts/android-smoke.sh --pref-dump"
    effort_h: "8-16"
    skills: [cpp, android, mozilla]
    agent_safe: yes
    isolation: worktree
    risk: Every M3 cfg-gated pref decision (android.cfg L2b locks, policy translations, privacy defaults) is inert on a running Android build until this is fixed.

