# F-Droid metadata for org.redoubtbrowser in the Redoubt F-Droid repository
# (LW-M6-03; docs/android/FDROID.md). scripts/fdroid-repo.sh copies this file
# into the repository's working directory before every `fdroid update`.
#
# This repository is BINARY-ONLY: it serves the same owner-signed APKs as the
# GitHub release (no Builds: section, no build server, no re-signing). F-Droid
# shows "What's new" as the Changelog: link below; fdroidserver writes
# per-version changelog text into index-v2 only for versions it built itself.
#
# AntiFeatures: Tracking, decided 2026-10-05 (docs/android/FDROID.md,
# "Anti-features"). F-Droid's own repository labels Fennec F-Droid and Mull,
# a hardened fork like this one, "Tracking" for connecting to Mozilla services
# by default; Redoubt still contacts Remote Settings and addons.mozilla.org by
# default, so the same label applies, with the reason spelled out.

AntiFeatures:
  Tracking:
    en-US: >-
      Contacts Mozilla services by default: Remote Settings (blocklists,
      certificate revocation data) and addons.mozilla.org (add-on updates,
      including uBlock Origin). Telemetry, experiments, crash-report upload and
      Google Play Services are removed. Details: https://redoubtbrowser.org/privacy.html

Categories:
