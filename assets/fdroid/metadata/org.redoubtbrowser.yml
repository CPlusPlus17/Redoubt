Changelog: https://github.com/CPlusPlus17/Redoubt/releases

Name: Redoubt
Summary: Privacy-hardened Firefox-based browser with LibreWolf's settings
# One line per paragraph: F-Droid 2.x shows hard line breaks as they are
# (seen on the emulator, docs/android/evidence/lw-m6-03).
Description: |-
    Redoubt is a privacy-hardened web browser for Android, built from Firefox's source with LibreWolf's privacy configuration and patch set applied.

    * Telemetry and experiments removed: Glean upload, Adjust, Nimbus, crash-report uploads and Google Play Services are patched out.
    * LibreWolf's privacy defaults: resist-fingerprinting, strict Enhanced Tracking Protection and cookie partitioning, Global Privacy Control on.
    * uBlock Origin preinstalled, with its cookie-notice lists on by default.
    * Cloud features off, such as page summaries, IP Protection and Google Lens.

    Network services it still uses by default: Mozilla's Remote Settings (blocklists, certificate revocation data) and addons.mozilla.org (add-on updates, including uBlock Origin). Firefox Sync is off until you sign in. F-Droid tells you about updates, so leave the app's own opt-in "Check for updates" switch off; builds after 157.0-2 hide it when F-Droid installed or last updated the app.

    The APKs in this repository are the same files as on the GitHub release page, signed with the same key. Signing certificate SHA-256: 64:14:EB:33:46:81:CF:6E:92:90:34:B5:6A:06:2D:2B:8D:A0:90:82:21:72:F7:A3:95:2C:85:FD:D1:28:3B:D0

    Redoubt is an independent project, not affiliated with or endorsed by LibreWolf or Mozilla. Known limits are listed at https://redoubtbrowser.org/privacy.html

# The only certificate this repository may ever carry for this app. fdroidserver
