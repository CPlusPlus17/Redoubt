# Where the Redoubt F-Droid repository is hosted (LW-M6-03, docs/android/FDROID.md).
#
# NOT SECRET. The S3 credentials are never here: they live in the owner's
# ~/redoubt-fdroid/s3.env (mode 600). This file is parsed, never sourced, by
# scripts/fdroid-repo.sh and scripts/site-check.py: KEY=value, one per line,
# no quotes, no spaces.
#
# Host: the owner's Hetzner Object Storage bucket (owner decision 2026-10-05).
#   repository  https://<S3_BUCKET>.<S3_LOCATION>.your-objectstorage.com/repo
#   archive     https://<S3_BUCKET>.<S3_LOCATION>.your-objectstorage.com/archive
#   S3 API      https://<S3_LOCATION>.your-objectstorage.com
#
# S3_BUCKET      Empty until the owner has created the bucket. `fdroid-repo.sh
#                init --bucket <name> --location <loc>` fills it in; commit the
#                result. Suggested: redoubt-fdroid. Bucket names are unique
#                across all Hetzner customers, so it may be taken. Never change
#                it once users have added the repository: the URL is the
#                repository's identity (FDROID.md, "Mirrors").
# S3_LOCATION    fsn1 (Falkenstein), nbg1 (Nuremberg) or hel1 (Helsinki).
# KEEP_VERSIONS  releases shown in the main section; every older release is
#                kept in the archive section, never deleted.
#
# S3_ENDPOINT and PUBLIC_BASE_URL exist for throwaway tests against a local S3
# server only. site-check.py refuses this file if it sets either of them.
S3_BUCKET=
S3_LOCATION=fsn1
KEEP_VERSIONS=5
