
/** ===========================================================================
 * OVERLAY isolation-media (LW-M7-50) -- appended by scripts/librewolf-patches.py
 * --overlays=isolation-media AFTER common.cfg + android.cfg, so these calls run
 * last. A build without that overlay never sees this file.
 *
 * Owner decisions 2026-10-10, verbatim:
 *   plan        "Prototype now, ship ON in a 158 dot release if it tests clean"
 *   trade-off   "Keep software codecs in the page process"
 *   testing     "Yes, separate dev app"
 *
 * The overlay turns isolated content processes back on
 * (patches/android/isolation-media-process.patch). An isolated content process
 * cannot reach Android's Java MediaCodec (bug 1810736), so H.264, HEVC and AAC
 * are decoded by ffvpx driving the NDK MediaCodec in the RDD process (video)
 * and the Utility process (audio). Both run with the app uid, not isolated.
 *
 * The eleven prefs are upstream's own isolated-process configuration, copied
 * name for name and value for value from bug 1988531 part 1, mozilla-firefox
 * commit e0286afb5f6836d607a3f218a527db69979c0bbd (2026-10-06, Firefox 159),
 * taskcluster/test_configs/variants.yml, variant geckoview-isolated-process,
 * the eleven "--setpref=" lines. That commit changes nothing else. All eleven
 * are `mirror: always` static prefs in Firefox 158.0
 * (modules/libpref/init/StaticPrefList.yaml:12642, 12676, 12703, 12747, 12780,
 * 12799, 12818, 12837, 12893, 12905, 12948) and nothing under mobile/android
 * writes them at runtime, so an autoconfig lockPref holds.
 *
 * Locked, like every security-relevant Redoubt pref: about:config cannot move
 * decoding back into the isolated process (where H.264 has no decoder) or turn
 * the RDD process off.
 *
 * NOT here, on purpose: which codecs go to RDD. Upstream sends every codec
 * there. Redoubt keeps the software decoders (VP8, VP9, AV1, Opus, Vorbis, FLAC,
 * MP3, WAV) in the isolated content process with a Gecko change, not a pref
 * (patches/android/isolation-media-codecs-in-content.patch), because no pref
 * can express it (docs/android/ISOLATION-MEDIA-STUDY.md section 6e).
 * ===========================================================================*/
lockPref("media.android-media-codec.enabled", false);
lockPref("media.android-media-codec.preferred", false);
lockPref("media.ffmpeg.encoder.enabled", true);
lockPref("media.ffvpx-hw.enabled", true);
lockPref("media.rdd-ffvpx.enabled", true);
lockPref("media.rdd-opus.enabled", true);
lockPref("media.rdd-process.enabled", true);
lockPref("media.rdd-vorbis.enabled", true);
lockPref("media.rdd-vpx.enabled", true);
lockPref("media.rdd-wav.enabled", true);
lockPref("media.use-remote-encoder.video.platform", true);
