blank_issues_enabled: true
contact_links:
  - name: Security vulnerability — do NOT open a public issue
    url: https://github.com/CPlusPlus17/Redoubt/security/advisories/new
    about: >-
      Memory-safety bugs, APK signature mismatches, or anything suggesting a
      distribution channel served a build we did not sign. Report these privately
      through GitHub's security advisories or by email to
      security@redoubtbrowser.org. The full process, including the signature- and
      channel-compromise cases, is in docs/android/SECURITY.md.
  - name: Questions, support and general chat
    url: https://github.com/CPlusPlus17/Redoubt/discussions
    about: >-
      "How do I …" and "why does Redoubt …" belong in Discussions. The FAQ at
      https://redoubtbrowser.org/faq.html answers the common ones.
